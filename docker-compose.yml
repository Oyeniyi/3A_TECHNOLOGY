version: '3.8'

# ==============================================================================
# 3A Technology Solutions — Docker Compose Orchestration
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: 3a-technology-web:latest
    container_name: 3a-technology-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://3atechnology.com}
      - NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER:-+2348030000000}
      - NOTIFICATION_EMAIL_TO=${NOTIFICATION_EMAIL_TO:-info@3atechnology.com}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@3atechnology.com}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.3atechnology.service=web-platform"
      - "com.3atechnology.environment=production"
